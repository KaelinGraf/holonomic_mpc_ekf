# Demonstrator parameters, mirroring dock_params('demo') exactly (brief Section 9),
# except geom, measured on the robot (2026-10-13), and four IMU values.
# - geom: wheel centres 153 mm (x) by 178 mm (y), so lx 76.5 and ly 89 mm; wheel
#   diameter 55 mm at the rollers; camera lens 70 mm ahead of base_link, on the
#   centre line (its height, 0.08, is still a guess). The robot's coupler is 201 mm
#   ahead of base_link (76 + 125) and meets the dock's, 35 mm in front of the
#   board (moved in from 125 mm late on 2026-10-13), at x = 0, so the board plane
#   is 0.236 m out. The dock's coupler is on the board's centre line, but docking
#   there ended about 1 cm left of the coupler (2026-10-13), so the target
#   is moved 1 cm to the robot's right: marker_m, the board centre in the target
#   frame, is (0.236, 0.010), the board 1 cm left of the docked robot. Then 5 mm
#   further out, (0.241, 0.010): pressed against the coupler, the fixes put the robot
#   3-7 mm short (camera-board range 0.197 m), so DOCKED never came.
#   2026-10-14, the 200 mm board (40.5 mm squares) mounted, camera recalibrated: docked against
#   the coupler, the fixes read x -26.4 mm, y +6.4 mm, theta -0.90 deg (camera-board range 0.265 m).
#   marker_m (0.2672, 0.0078) and marker_psi0_deg 180.92 make that pose read (0, 0, 0), solved
#   through FiducialChain on 62 live docked poses.
# - sup: APPROACH aims 40 mm short of the dock (standoff 0.04, from 0.30) and hands
#   over within 20 mm of that; FINAL's heading lock is only for the last centimetres
#   (2026-10-13). dock_tol 5 mm (from 3) for the fixes' noise at contact. Docked, the lens is then
#   0.166 m from the board. The board is 5 x 5 squares of 40.5 mm (the 200 mm A4 print, measured
#   2026-10-14; the first print was 24 mm), which puts its centre
#   (2.5, 2.5) squares from the lattice's outer corner. Its rotation about its
#   own normal is normalised out (fiducial.FiducialChain): only the centre's
#   position and the normal's yaw are used, so it may be mounted at any rotation.
# - imu.rate (150) is the robot IMU's nominal rate, which the supervisor only uses
#   for its start check.
# - ekf.step_s (5 ms) is the MATLAB design's fixed step (its 200 Hz). The EKF steps
#   each sample's own interval in steps near it, and the ekf floors are per step_s.
# - lim: the speed limits are 60% of the design's (2026-10-13):
#   v_approach 0.30 -> 0.18 m/s, v_final 0.05 -> 0.03 m/s, r_max 0.5 -> 0.30 rad/s and
#   w_max 15 -> 9 rad/s. The accelerations, from which mpc.Ru is derived, are unchanged.
# - ekf.zupt_*: once cmd_vel has been zero for zupt_settle_s, the EKF holds the velocity at
#   zero (sigma zupt_sigma_v), and lets the pose random-walk by zupt_q_p and zupt_q_th_deg
#   per root second, so a board moved by hand moves the pose, not the velocity.
# - mpc.th_max_deg is 180: the heading corridor is off (2026-10-13,
#   so that the robot can start far off the board's normal). The heading is still in the
#   cost (Qy's theta weight, from tol.tgt_th_deg), which pulls it into line with the
#   board; the corridor's exact-penalty slack made it all but hard. The no-penetration
#   row (contact_band) keeps the slack.
# - mpc.Np is 80 (a 4 s horizon), up from the design's 40 (2 s)
#   (2026-10-13). The closed-loop test docks at 40, 80 and 120; a step solves in about
#   0.7 ms on the laptop at 80 (1.5 ms p99), about 2.8 times that on the Pi.
# - mpc.rw and mpc.Qy's lateral weight (2026-10-13, after the robot's runs that day):
#   - rw is an effort weight per axis [u_b, v_b, r_b] on the increments, multiplying the
#     derived Ru. At the design's 1.0 the tracking cost summed over the 80-step horizon
#     outweighed it by about 300 to 1, so each tick planned a time-optimal turn (r_b
#     driven at alpha_max to r_max and back); the wheels' lag of about 0.2 s (0.15 s
#     time constant and 50 ms to the motors) then overshot every time, a heading limit
#     cycle of about +-4 deg, r_b swinging +-0.30 rad/s, about 1.4 s a period. 16 on the
#     translation and 1024 (16 x 64) on turning take it out in simulation with that lag
#     (theta sd 2 -> 0.1-0.7 deg) at about the same docking time.
#   - Later the same evening, on the robot with the drive calibrated, turning at 1024
#     was too dear: the robot strafed around in an arc instead of turning in while it
#     drove. Turning is now 64 (16 x 4), and qw doubles the
#     heading's tracking weight, so the plan turns to face the board early. In
#     simulation (lag, 40 deg field of view, starts 15-40 deg off): it turns in sooner,
#     strafes less, still arrives within about 2 mm, heading sd 0.5-0.6 deg.
#   - qw multiplies the derived Qy per axis [x, y, theta], as rw does Ru. qw_final is
#     FINAL's: heading lock (theta x10). APPROACH only aligns roughly (align_tol 3 cm,
#     5 deg, from 1 cm and 1 deg), then FINAL locks the heading in, at v_final 0.09 m/s
#     (from 0.03; FINAL need not be slower). Simulated:
#     docks in 7-12 s (from 14-17), heading within 1 deg in FINAL, contact at about
#     0.05 m/s, at most 5 mm past; at 0.18 m/s it overshot up to 19 mm.
#   - Qy's lateral weight is tol.tgt_y^-2 (62500) instead of tol.y^-2 (6944): see
#     params.check. With the range and lateral errors weighted alike, the L1 speed cap
#     went to the range first; on the robot a sideways drift while driving in was left
#     until the coupler (53 mm off at x = -40 mm), where 0.03 m/s could not strafe it.
#     In simulation with the lag, that drift and the 40 deg camera field of view, the
#     robot now arrives within 5 mm of the centre line and keeps the board in view.
#   - 2026-10-14, after it was seen to strafe hard while far out, overshoot and come back
#     (the cause: mpc_analysis_2026-10-14 in the report notes): the speed cap is per axis,
#     |u_b| <= v_max and |v_b| <= v_max (Mpc.A_AMP), not |u_b| + |v_b|,
#     under which the whole budget went to one axis. APPROACH's lateral weight is a quarter
#     (qw y 0.25: 15625, 2.25 times the range's, from 9 times); FINAL keeps the full weight
#     for the 4 mm docking target. Simulated with the drive as measured on the robot (0.84x
#     forward, 0.57x strafe, 0.15 s lag, 42 deg half field of view), five starts 0.8-1.2 m out,
#     up to 30 cm and 30 deg off: 5 of 5 dock (the L1 cap: 4, one aborted with the board out
#     of view), 0.21-0.24 m of forward progress in the first 2 s (0.04-0.24), at most 13 mm
#     past the centre line.
#   - Later on 2026-10-14 the robot arced in, then crossed the centre line just before the
#     standoff still strafing at about 0.1 m/s and overshot 24 mm (bag dock_20261013_234438):
#     the lateral correction came too late. APPROACH's weights now ramp (Supervisor.approach_qw)
#     from qw (lateral 0.25) to qw_near (1.0) as the distance still to go to the standoff falls
#     from 0.80 to 0.25 m. Simulated on 16 starts (the eight real ones of 2026-10-13, the two of
#     2026-10-14 with their drives, six made-up): 16 of 16 dock; |y| 15 cm out 4 mm (from 33);
#     sideways speed at x = -0.06 m 11 mm/s (from 25). Constant 1.0 does as well near the dock
#     but strafes first far out.
#   - Align, then plunge (2026-10-14, after bags dock_20261013_235737 and _235808: the
#     robot lost the board while arcing in, and reached the coupler strafing, 7 deg off):
#     - APPROACH's heading looks at the board (look_at_m: the bearing from the camera to the
#       board centre beyond 0.30 m to go, blending to theta = 0 by 0.06 m), so the camera keeps
#       it centred while the robot arcs in.
#     - Its speed cap falls to v_align 0.04 from 0.30 to 0.08 m to go (slow_m), and its heading
#       weight to qw_near's 10: settling at full speed, the plan hunted +-30 mm sideways
#       (simulated; the drive answers late and short).
#     - The standoff, now 0.08 m out, hands over only once |y| < 10 mm, |theta| < 2 deg, within
#       15 mm of it, under 0.03 m/s and 4 deg/s, for 0.2 s.
#     - FINAL drives straight in, |v_b| capped at v_lat_final 0.02 (per axis, not L1): strafing
#       right at 0.09 m/s yawed the robot +6 deg into the coupler on 2026-10-14.
#     - Simulated on 19 starts (all real ones with their drives, six made-up): 18 dock, median
#       11.0 s; FINAL entry |y| 1.8 mm, |theta| 0.5 deg; FINAL |v_b| <= 0.02, |theta| <= 2.8 deg.
#       The previous tuning docks 19 (7.2 s) but strafes at 0.09 m/s into the coupler, which the
#       simulator, without the drive's strafe-to-yaw coupling, cannot fault.
#     - Same day, after two runs that docked (bags dock_20261014_001307, _001407): the heading
#       swung +-2-3 deg at about 1.3 s a period over the slow last stretch, r_b at r_max both
#       ways with the look-at reference at 0: the yaw limit cycle of 2026-10-13, back because
#       qw_near's heading weight was 10. It is 2 again (the heading lock, 10, is FINAL's only).
#       It need not stop at the approach point; it must only be
#       aligned: the settle conditions (align_vtol, align_rtol_deg, align_dwell_s) are
#       off, so the standoff hands over the moment the robot is aligned (10 mm, 2 deg). Simulated
#       on 19 starts: 19 dock, median 10.2 s, no heading reversals in APPROACH (21 before at
#       worst); v_align 0.06 or 0.08 is faster (9.1-9.3 s) but loses one or two starts.
# - lim.w_max 12 rad/s (2026-10-14, from 9; the design had 15 before the 60 % cut): at 9 the
#   wheel rows held most of APPROACH (35-82 % of moving ticks at 95 % or more), so driving at
#   the 0.18 m/s cap left no wheel speed to turn with and the robot turned late (bag
#   dock_20261014_001819: heading 9-25 deg behind the look-at reference until the slowdown).
#   The motors had room: pulses reached 207-265 us of the firmware's 800. Simulated on 19
#   starts: 12 turns in sooner (largest heading error in APPROACH's last 0.3 m 34 deg, from 50)
#   and docks 19 of 19 with the board always in view; 15 turns sooner still (25 deg) but one
#   start lost the board for 6 fixes (bearing 42 deg). The linear caps are unchanged.
# - sup.start_sigma_m 0.03 (2026-10-14): ACQUIRE waits for a position sd under 3 cm. An ambiguous
#   start 2.2 m out (bag dock_20261014_002123: the two solutions 15 cm apart) entered APPROACH
#   with a 70 mm lateral sd and the covariance abort fired 0.05 s later.
# - fid.sigma_th_floor_deg 1.0 (2026-10-14): each fix's heading variance is at least (1 deg)^2.
#   The pipeline claimed 0.03-0.18 deg; against the EKF the fixes scattered 0.66 deg RMS over a
#   run and 0.4-2.7 deg at the coupler, so the gate's NIS was dominated by heading: fixes whose
#   position agreed within 1 sd were rejected, re-anchors followed, and at the coupler the
#   position variance passed the abort limit (bag dock_20261013_234613).
# - imu.sigma_a and imu.sigma_r_deg were measured on the robot (2026-10-13: the
#   standard deviation of 60 s at rest, at 150 Hz) and replace the bench values
#   0.02 m/s^2 and 0.15 deg/s.
#
# The one parameter file: every node and every test reads it through
# dock_control.params, and no other file holds a number. Values marked "bench" or
# "measure" are replaced by the calibration procedures of brief Section 10.
#
# mpc.Qy, mpc.Ru and mpc.rho_s are derived values. params.check() recomputes Qy
# and Ru from tol and lim (report eq. 15), and every node refuses to start if the
# file disagrees with them.
#
# Write exponents with a sign (5.8e+6, not 5.8e6): YAML 1.1 reads 5.8e6 as a
# string, and params.load() rejects any value that is not a number.
#
# fid.sigma_p0, fid.d0 and fid.sigma_th_deg only simulate fixes (the tests). On
# the robot each pose's noise comes live with it, in RosInferenceResult's
# covariance, and ekf_node carries that through the chain into R.
dock:
  imu:  {rate: 150, sigma_a: 0.022, sigma_r_deg: 0.026, q_scale: 4}
  fid:  {rate: 15, delay_nominal: 0.05, sigma_p0: 0.004, sigma_th_deg: 0.5, d0: 1.0, gate: 100,
         sigma_th_floor_deg: 1.0}
  ekf:  {q_v: 4.5e-6, q_th: 3.8e-9, p_floor: 1.0e-8, sigma_v0: 0.1, buffer_s: 0.5, step_s: 0.005, zupt_settle_s: 0.3, zupt_sigma_v: 0.005,
         zupt_q_p: 0.05, zupt_q_th_deg: 10.0}
  geom: {Rw: 0.0275, lx: 0.0765, ly: 0.089, Lk: 0.201, cam_xyz: [0.070, 0.0, 0.08], marker_m: [0.2672, 0.0078], marker_psi0_deg: 180.92,
         board_squares: [5, 5], board_square_m: 0.0405}
  lim:  {v_approach: 0.18, v_align: 0.04, v_final: 0.09, v_lat_final: 0.02, a_max: 0.5, r_max: 0.30, alpha_max: 1.0, w_max: 12.0}
  mpc:  {Ts: 0.05, Np: 80, Nc: 10, rw: [16, 16, 64], qw: [1, 0.25, 2], qw_near: [1, 1, 2], qw_final: [1, 1, 10], contact_band: 0.010, th_max_deg: 180, Qy: [6944, 62500, 1459], Ru: [1600, 1600, 400], rho_s: 5.8e+6}
  sup:  {start_sigma_m: 0.03, qw_ramp_m: [0.80, 0.25], look_at_m: [0.30, 0.06], slow_m: [0.30, 0.08],
         standoff: 0.08, align_tol_m: 0.010, align_tol_deg: 2.0, standoff_tol: 0.015, dock_tol: 0.005, dock_vtol: 0.02, hold_after_s: 0.5, abort_after_s: 2.0}
  tol:  {y: 0.012, th_deg: 20, tgt_y: 0.004, tgt_th_deg: 1.5}
